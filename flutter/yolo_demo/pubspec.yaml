name: yolo_demo
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ultralytics_yolo: any
  path_provider: ^2.1.2
  archive: ^3.4.10
  http: ^1.1.0
  xml2json: ^6.0.0
  camera: ^0.10.5+1
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.9.0
  flutter_dotenv: ^5.1.0
  cached_network_image: ^3.3.1
  flutter_markdown: ^0.6.10
  audioplayers: ^6.1.0
  auto_size_text: ^3.0.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
